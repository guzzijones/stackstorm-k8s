{{- if and .Values.rabbitmq.enabled (not .Values.rabbitmq.secretBackend.vault.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-st2-rabbitmq-config
  annotations:
    description: StackStorm RabbitMQ messaging credentials configuration
  labels: {{- include "stackstorm-ha.labels" (list $ "st2") | nindent 4 }}
type: Opaque
stringData:
  st2.rabbitmq.conf: |
    [messaging]
    {{- $rabbitmqSecret := lookup "v1" "Secret" .Release.Namespace (required "rabbitmq.auth.existingSecret is required when rabbitmq is enabled!" (index .Values "rabbitmq" "auth" "existingSecret")) }}
    {{- if $rabbitmqSecret }}
    {{- $username := index $rabbitmqSecret.data "username" | b64dec }}
    {{- $password := index $rabbitmqSecret.data "password" | b64dec }}
    url = amqp://{{ $username }}:{{ $password }}@{{ .Release.Name }}-rabbitmq:5672/
    {{- else }}
    # WARNING: RabbitMQ credentials secret not found. This will cause authentication failures.
    # Secret name: {{ index .Values "rabbitmq" "auth" "existingSecret" }}
    # Namespace: {{ .Release.Namespace }}
    url = amqp://PLACEHOLDER_USERNAME:PLACEHOLDER_PASSWORD@{{ .Release.Name }}-rabbitmq:5672/
    {{- end }}
{{- end }}
