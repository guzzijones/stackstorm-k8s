{{- if index .Values "mongodbCommunity" "enabled" }}
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ .Release.Name }}-mongodb
  labels: {{- include "stackstorm-ha.labels" (list $ "mongodb") | nindent 4 }}
spec:
  members: {{ index .Values "mongodbCommunity" "members" }}
  type: ReplicaSet
  version: {{ index .Values "mongodbCommunity" "version" | quote }}
  agent:
    {{- with index .Values "mongodbCommunity" "agent" }}
    logLevel: {{ .logLevel | default "INFO" }}
    maxLogFileDurationHours: {{ .maxLogFileDurationHours | default 24 }}
    {{- if .logRotate }}
    {{- if .logRotate.enabled }}
    logRotate:
      sizeThresholdMB: {{ .logRotate.sizeThresholdMB | default "1000" | quote }}
      timeThresholdHrs: {{ .logRotate.timeThresholdHrs | default 24 }}
      numTotal: {{ .logRotate.numTotal | default 10 }}
      numUncompressed: {{ .logRotate.numUncompressed | default 3 }}
      percentOfDiskspace: {{ .logRotate.percentOfDiskspace | default "5.0" | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
  security:
    authentication:
      modes: {{ index .Values "mongodbCommunity" "auth" "modes" | toJson }}
  users:
    {{- with index .Values "mongodbCommunity" "auth" "st2User" }}
    - name: {{ .name }}
      db: {{ .database }}
      passwordSecretRef:
        name: {{ .existingSecret | required "mongodbCommunity.auth.st2User.existingSecret is required" }}
        key: {{ .passwordSecretKey }}
      roles: {{- toYaml .roles | nindent 8 }}
      scramCredentialsSecretName: {{ $.Release.Name }}-mongodb-{{ .name }}-scram
    {{- end }}
    {{- with index .Values "mongodbCommunity" "auth" "adminUser" }}
    - name: {{ .name }}
      db: {{ .database }}
      passwordSecretRef:
        name: {{ .existingSecret | required "mongodbCommunity.auth.adminUser.existingSecret is required" }}
        key: {{ .passwordSecretKey }}
      roles: {{- toYaml .roles | nindent 8 }}
      scramCredentialsSecretName: {{ $.Release.Name }}-mongodb-{{ .name }}-scram
    {{- end }}
    {{- range index .Values "mongodbCommunity" "auth" "additionalUsers" }}
    - name: {{ .name }}
      db: {{ .database }}
      passwordSecretRef:
        name: {{ .existingSecret | required "Each additionalUser must have an existingSecret defined" }}
        key: {{ .passwordSecretKey }}
      roles: {{- toYaml .roles | nindent 8 }}
      scramCredentialsSecretName: {{ $.Release.Name }}-mongodb-{{ .name }}-scram
    {{- end }}
  {{- if index .Values "mongodbCommunity" "tls" "enabled" }}
    tls:
      enabled: true
      {{- if index .Values "mongodbCommunity" "tls" "certificateKeySecretRef" }}
      certificateKeySecretRef:
        name: {{ index .Values "mongodbCommunity" "tls" "certificateKeySecretRef" }}
      {{- end }}
      {{- if index .Values "mongodbCommunity" "tls" "caCertificateSecretRef" }}
      caCertificateSecretRef:
        name: {{ index .Values "mongodbCommunity" "tls" "caCertificateSecretRef" }}
      {{- end }}
  {{- end }}
  additionalMongodConfig:
    storage:
      wiredTiger:
        engineConfig:
          journalCompressor: zlib
  statefulSet:
    spec:
      template:
        spec:
          serviceAccountName: mongodb-database
          {{- with index .Values "mongodbCommunity" "nodeSelector" }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with index .Values "mongodbCommunity" "affinity" }}
          affinity: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with index .Values "mongodbCommunity" "tolerations" }}
          tolerations: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if index .Values "mongodbCommunity" "resources" }}
          containers:
            - name: mongod
              {{- with index .Values "mongodbCommunity" "resources" }}
              resources: {{- toYaml . | nindent 16 }}
              {{- end }}
            - name: mongodb-agent
              {{- with index .Values "mongodbCommunity" "resources" }}
              resources: {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- end }}
      {{- if index .Values "mongodbCommunity" "persistence" "enabled" }}
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: [ "ReadWriteOnce" ]
            {{- if index .Values "mongodbCommunity" "persistence" "storageClassName" }}
            storageClassName: {{ index .Values "mongodbCommunity" "persistence" "storageClassName" | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ index .Values "mongodbCommunity" "persistence" "storage" }}
        - metadata:
            name: logs-volume
          spec:
            accessModes: [ "ReadWriteOnce" ]
            {{- if index .Values "mongodbCommunity" "persistence" "storageClassName" }}
            storageClassName: {{ index .Values "mongodbCommunity" "persistence" "storageClassName" | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ index .Values "mongodbCommunity" "persistence" "logsStorage" }}
      {{- end }}
{{- end }}
