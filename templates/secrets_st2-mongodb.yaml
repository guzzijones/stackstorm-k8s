{{- if and .Values.mongodbCommunity.enabled (index .Values "mongodbCommunity" "auth" "st2User" "existingSecret") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-st2-mongodb-config
  annotations:
    description: StackStorm MongoDB database credentials configuration
  labels: {{- include "stackstorm-ha.labels" (list $ "st2") | nindent 4 }}
type: Opaque
stringData:
  st2.secrets.conf: |
    [database]
    host = mongodb://{{ template "stackstorm-ha.mongodb-nodes" $ }}/{{ required "mongodbCommunity.auth.st2User.database is required!" (index .Values "mongodbCommunity" "auth" "st2User" "database") }}?authSource={{ required "mongodbCommunity.auth.st2User.database is required!" (index .Values "mongodbCommunity" "auth" "st2User" "database") }}&authMechanism=SCRAM-SHA-256&replicaSet={{ .Release.Name }}-mongodb
    port = 27017
    username = {{ required "mongodbCommunity.auth.st2User.name is required!" (index .Values "mongodbCommunity" "auth" "st2User" "name") }}
    {{- $mongoSecret := lookup "v1" "Secret" .Release.Namespace (index .Values "mongodbCommunity" "auth" "st2User" "existingSecret") }}
    {{- if $mongoSecret }}
    {{- $passwordKey := default "password" (index .Values "mongodbCommunity" "auth" "st2User" "passwordSecretKey") }}
    password = {{ index $mongoSecret.data $passwordKey | b64dec }}
    {{- else }}
    # WARNING: MongoDB password secret not found. This will cause authentication failures.
    # Secret name: {{ index .Values "mongodbCommunity" "auth" "st2User" "existingSecret" }}
    # Namespace: {{ .Release.Namespace }}
    password = PLACEHOLDER_PASSWORD_SECRET_NOT_FOUND
    {{- end }}
    db_name = {{ required "mongodbCommunity.auth.st2User.database is required!" (index .Values "mongodbCommunity" "auth" "st2User" "database") }}
{{- end }}
