version: 2.1

# Add additional CircleCI Orbs dependencies
orbs:
  # https://circleci.com/orbs/registry/orb/circleci/kubernetes
  kubernetes: circleci/kubernetes@2.0.2
  # https://circleci.com/orbs/registry/orb/circleci/helm
  helm: circleci/helm@3.2.0
  # https://circleci.com/orbs/registry/orb/ccpgames/minikube
  minikube: ccpgames/minikube@0.0.1

jobs:
  # Spin up minikube K8s cluster and run Helm chart & e2e tests on it
  e2e-k8s:
    parameters:
      kubernetes-version:
        type: string
    # 'large' 4 vCPUs & 15GB RAM CircleCI machine executor
    # required to deploy heavy 'stackstorm-ha' Helm release with RabbitMQ, MongoDB, Redis clusters and 25+ st2 Pods.
    # https://circleci.com/docs/2.0/configuration-reference/#machine-executor-linux
    resource_class: large
    machine:
      # Available images https://circleci.com/docs/2.0/configuration-reference/#available-machine-images
      image: ubuntu-2204:current
    steps:
      - checkout
      - kubernetes/install
      - minikube/minikube-install:
          # https://github.com/kubernetes/minikube/releases
          version: v1.38.1
      - run:
          name: Install Helm v3
          command: curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash
      - run:
          name: Create new K8s cluster
          command: minikube start --vm-driver=docker --memory 8192 --cpus 4 --kubernetes-version=<< parameters.kubernetes-version >>
      - run:
          name: Add mirror repos for aliased dependencies
          command: |
            helm repo add bitnami-mirror https://charts.bitnami.com/bitnami
            helm repo add valkey-mirror https://valkey.io/valkey-helm/
            helm repo add mongodb https://mongodb.github.io/helm-charts
      - run:
          name: Update stackstorm-ha chart dependencies
          command: helm dependency update
      - run:
          name: Install MongoDB Community Operator (CI)
          # watchNamespace="*" makes the operator (installed in default) reconcile
          # the MongoDBCommunity CR in the release namespace; bundles its CRD.
          command: helm install community-operator mongodb/community-operator
            --set operator.watchNamespace="*"
            --wait
      - run:
          name: Install cert-manager (CI)
          # The RabbitMQ cluster-operator manifest ships cert-manager
          # Certificate/Issuer resources for its serving+metrics TLS, so
          # cert-manager (CRDs + webhook) must exist before applying it.
          command: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
      - run:
          name: Wait for cert-manager to be ready
          command: |
            kubectl -n cert-manager rollout status deploy/cert-manager --timeout=180s
            kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s
            kubectl -n cert-manager rollout status deploy/cert-manager-cainjector --timeout=180s
      - run:
          name: Install RabbitMQ Cluster Operator (CI)
          # Retry to ride out cert-manager webhook warmup (Certificate/Issuer
          # admission can briefly refuse connections right after rollout).
          command: |
            for i in 1 2 3 4 5 6; do
              kubectl apply -f https://github.com/rabbitmq/cluster-operator/releases/latest/download/cluster-operator.yml && break
              echo "apply failed (attempt $i), retrying in 10s..."
              sleep 10
            done
      - run:
          name: Wait for operators to be ready
          command: |
            kubectl rollout status deploy/mongodb-kubernetes-operator --timeout=180s
            kubectl -n rabbitmq-system rollout status deploy/rabbitmq-cluster-operator --timeout=180s
      - run:
          # CI-only fakes so --wait installs can render/boot. Production must instead
          # set real valkey auth, real rabbitmq.auth.existingSecret, and real MongoDB
          # user secrets (mongodbCommunity.auth.{st2User,adminUser}.existingSecret).
          name: Create fake credentials secrets (CI only)
          command: |
            kubectl create secret generic st2-rabbitmq-ci \
              --from-literal=username=st2-rabbitmq \
              --from-literal=password=ci-fake-password \
              --from-literal=erlangCookie=ci-fake-erlang-cookie \
              --from-literal=default_user.conf=$'default_user = st2-rabbitmq\ndefault_pass = ci-fake-password'
            kubectl create secret generic mongodb-st2-user-secret --from-literal=password=ci-fake-password
            kubectl create secret generic mongodb-admin-user-secret --from-literal=password=ci-fake-password
      - run:
          name: Helm install stackstorm-ha chart
          command: helm install --timeout 15m0s --debug --wait --name-template stackstorm-ha
            --set valkey.auth.enabled=false
            --set rabbitmq.auth.existingSecret=st2-rabbitmq-ci
            --set mongodbCommunity.members=1
            --set rabbitmq.replicas=1
            --set valkey.replica.replicas=1
            .
      - run:
          name: Helm test
          command: helm test stackstorm-ha
      - run:
          name: Helm upgrade with RBAC enabled
          command: helm upgrade --set st2.rbac.enabled=true --timeout 15m0s --debug --wait
            --set valkey.auth.enabled=false
            --set rabbitmq.auth.existingSecret=st2-rabbitmq-ci
            --set mongodbCommunity.members=1
            --set rabbitmq.replicas=1
            --set valkey.replica.replicas=1
            stackstorm-ha .
      - run:
          name: Helm test with RBAC enabled
          command: helm test stackstorm-ha
      - run:
          when: always
          name: Show created K8s resources
          command: kubectl get all

workflows:
  version: 2
  e2e:
    jobs:
      - e2e-k8s:
          matrix:
            parameters:
              # https://kubernetes.io/releases
              kubernetes-version:
                - "v1.37.0"
                - "v1.36.4"
                - "v1.35.8"
  # Run periodic nightly Helm tests to ensure there are no regressions
  e2e-nightly:
    jobs:
      - e2e-k8s:
          matrix:
            parameters:
              # https://kubernetes.io/releases
              kubernetes-version:
                - "v1.37.0"
                - "v1.36.4"
                - "v1.35.8"
    triggers:
      - schedule:
          cron: "0 1 * * *"
          filters:
            branches:
              only:
                - master

experimental:
  notify:
    branches:
      only:
        - master
