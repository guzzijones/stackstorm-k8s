  # The pod will not be marked as "running" until this script completes successfully.
  # see: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
  postStartScript: ""

##
## Various batch jobs (apply-rbac-definitions, apikey-load, key-load, register-content)
##
jobs:
  # st2client config (~/.st2/config) template for jobs that need it.
  # see: https://docs.stackstorm.com/reference/cli.html#configuration-file
  # You can access env variables here because this is used in a bash heredoc.
  # For example, you could use a var injected with envFromSecrets.
  # Note that Helm templating is supported in this block!
  st2clientConfig: |
    [credentials]
    username = ${ST2_AUTH_USERNAME}
    password = ${ST2_AUTH_PASSWORD}
  annotations: {}
  # Override default image settings (for now, only tag can be overridden)
  # The Jobs use the st2actionrunner image
  image: {}
    ## Note that Helm templating is supported in this block!
    #tag: "{{ .Values.image.tag }}"
  # If defined, this preRegisterContentCommand runs in an initContainer on the st2-register-content Job.
  # The initContainer also uses the st2actionrunner image but runs this command instead of its entrypoint.
  preRegisterContentCommand: []
    # For example, to disable aliases in the "packs" system pack before content is registered:
    # - "/bin/bash"
    # - "-c"
    # - |
    #   sed -i -e 's/^\(\s*\)enabled: true/\1enabled: false/' /opt/stackstorm/packs/packs/aliases/*.yaml
    #   for alias in /opt/stackstorm/packs/packs/aliases/*.yaml; do
    #     grep -q 'enabled:' ${alias} || sed -i -e 's/^\(\s*\)name:\(.*\)$/\1name: \2\n\1enabled: false/m' ${alias}
    #   done
  # Additional advanced settings to control pod/deployment placement
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: {}
  # HTTP_PROXY: http://proxy:1234
  ## These named secrets (managed outside this chart) will be added to envFrom.
  envFromSecrets: []
  # mount extra volumes on the jobs pods (primarily useful for k8s-provisioned secrets)
  ## Note that Helm templating is supported in 'mount' and 'volume'
  extra_volumes: []
    # see examples under st2actionrunner.extra_volumes
  #
  # Advanced controls to skip creating jobs.
  # This is useful in targeted upgrades with `--set`. Do not set this in values files.
  # Possible jobs include: apply_rbac_definitions, apikey_load, key_load, register_content
  # For example, if an upgrade only touches RBAC config, use this to disable other jobs:
  #   helm upgrade ... --set 'jobs.skip={apikey_load,key_load,register_content}'
  skip: []
  #
  # Advanced: Add extra Helm hook Jobs
  # These hook jobs will use the same settings (eg image, annotations, pod placement) as the other jobs.
  # They will have st2 cli configured, st2.conf files, and packs volumes mounted.
  # See available hooks list: https://helm.sh/docs/topics/charts_hooks/#the-available-hooks
  extra_hooks: []
    # Each item in extra_hooks must define a 'name' and the "helm.sh/hook" value in 'hook'.
    # Note that Helm templating is supported in the 'command' block!
    #
    # - name: init-workflow  # required name
    #   hook: post-install   # required "helm.sh/hook"
    #   hook_weight: 10      # optional hook_weight (defaults to 10)
    #   resources: {}        # optional definition of resources to request
    #   podSecurityContext: {} # optional definition of pod securityContext override
    #   securityContext: {}  # optional definition of container securityContext override
    #   command:             # required command to run
    #     - st2
    #     - run
    #     - --tail
    #     - custom_pack.init_stackstorm
    #
    # - name: upgrade-warning
    #   hook: pre-upgrade, pre-rollback
    #   hook_weight: -5
    #   command:
    #     - st2
    #     - run
    #     - --tail
    #     - custom_pack.warn_about_upgrade

# for a remote mongodb deployment, set st2.config.mongodb.host/port/user/password and disable in-cluster mongodb deployment by setting st2.mongodbCommunity.enabled to false
mongodb:
  enabled: false
  authentication: false
  host: "mongodb"
  port: 27017
  user: "st2-admin"
  password: "CHANGE-ME-PLEASE"
##
## MongoDB Community Operator Configuration
##
## PREREQUISITE: MongoDB Community Operator must be installed in the cluster
## Install CRDs: kubectl apply -f https://raw.githubusercontent.com/mongodb/mongodb-kubernetes/1.7.0/public/crds.yaml 
## Install Operator: kubectl apply -f https://raw.githubusercontent.com/mongodb/mongodb-kubernetes/1.7.0/public/mongodb-kubernetes.yaml
##
## For MongoDBCommunity CRD reference:
## https://github.com/mongodb/mongodb-kubernetes-operator/blob/master/docs/deploy-configure.md
##
mongodbCommunity:
  # Change to `false` to disable in-cluster mongodb deployment.
  # Specify your external [database] connection parameters under st2.config
  enabled: true
  
  # MongoDB version
  version: "7.0.22"
  
  # Number of MongoDB replicas in the replica set
  members: 3
  
  # Name of the replica set
  
  # Authentication configuration
  # NOTE: The MongoDB Community Operator REQUIRES user definitions with passwords.
  # This is a CRD requirement - users and security fields cannot be omitted.
  auth:
    # Authentication modes - controls whether MongoDB enforces authentication
    # modes: ["SCRAM"] - Enforce SCRAM authentication (recommended for production)
    # modes: [] - No authentication enforcement (development only)
    modes: ["SCRAM"]
    
    # Required StackStorm application user configuration
    # Each user must have a separate Kubernetes secret containing their password
    st2User:
      name: "st2-admin"
      database: "st2"
      # REQUIRED: Name of Kubernetes secret containing this user's password
      # Example: Create the secret before installing this chart:
      #   kubectl create secret generic mongodb-st2-user-secret \
      #     --from-literal=password=YOUR_SECURE_ST2_PASSWORD
      existingSecret: "mongodb-st2-user-secret"
      # Key in the secret containing the password (default: "password")
      passwordSecretKey: "password"
      roles:
        - name: readWrite
          db: st2
        - name: clusterAdmin
          db: admin
    
    # Required MongoDB admin user configuration
    # Each user must have a separate Kubernetes secret containing their password
    adminUser:
      name: "admin"
      database: "admin"
      # REQUIRED: Name of Kubernetes secret containing this user's password
      # Example: Create the secret before installing this chart:
      #   kubectl create secret generic mongodb-admin-user-secret \
      #     --from-literal=password=YOUR_SECURE_ADMIN_PASSWORD
      existingSecret: "mongodb-admin-user-secret"
      # Key in the secret containing the password (default: "password")
      passwordSecretKey: "password"
      roles:
        - name: root
          db: admin
    
    # Optional: Additional MongoDB users
    # Each user must have their own separate Kubernetes secret
    additionalUsers: []
      # Example additional users (each with their own secret):
      # - name: "myapp-user"
      #   database: "myapp"
      #   # Create secret: kubectl create secret generic mongodb-myapp-user-secret --from-literal=password=MYAPP_PASSWORD
      #   existingSecret: "mongodb-myapp-user-secret"
      #   passwordSecretKey: "password"
      #   roles:
      #     - name: readWrite
      #       db: myapp
      # - name: "readonly-user"
      #   database: "st2"
      #   # Create secret: kubectl create secret generic mongodb-readonly-user-secret --from-literal=password=READONLY_PASSWORD
      #   existingSecret: "mongodb-readonly-user-secret"
      #   passwordSecretKey: "password"
      #   roles:
      #     - name: read
      #       db: st2
  
  # Persistence configuration
  persistence:
    enabled: true
    # Storage size per MongoDB pod (data volume)
    storage: "10Gi"
    # Storage size for MongoDB logs volume
    # MongoDB Community Operator requires a separate logs volume
    logsStorage: "2Gi"
    # Optional: specify storageClassName (uses cluster default when empty)
    storageClassName: ""
  
  # Agent configuration (automation agent settings)
  agent:
    # Log level for the automation agent
    logLevel: ERROR
    # Maximum duration in hours for a single log file
    maxLogFileDurationHours: 24
    # Log rotation configuration
    # Helps manage log file sizes and retention
    logRotate:
      # Enable log rotation (recommended for production)
      enabled: true
      # Rotate when log file reaches this size (in MB)
      # Can be fractional (e.g., "0.5" for 512KB)
      sizeThresholdMB: "1000"
      # Rotate log files every N hours
      timeThresholdHrs: 24
      # Maximum number of log files to keep (total)
      # Older files beyond this limit are deleted
      numTotal: 10
      # Number of recent log files to keep uncompressed
      # Older files are compressed to save space
      numUncompressed: 3
      # Maximum percentage of disk space logs can consume
      # Helps prevent logs from filling the disk
      percentOfDiskspace: "90.0"
  
  # TLS configuration (disabled by default)
  tls:
    enabled: false
    # When enabled, you must provide these secrets containing TLS certificates:
    # certificateKeySecretRef: mongodb-tls-cert
    # caCertificateSecretRef: mongodb-tls-ca
    # See: https://github.com/mongodb/mongodb-kubernetes-operator/blob/master/docs/deploy-configure.md#tls-configuration
  
  # Resource requests and limits for MongoDB pods
  resources: {}
    # limits:
    #   cpu: 2000m
    #   memory: 2Gi
    # requests:
    #   cpu: 1000m
    #   memory: 2Gi
  
  # Pod placement controls
  affinity: {}
  nodeSelector: {}
  tolerations: []

##
## RabbitMQ configuration (using RabbitMQ Cluster Operator)
##
## PREREQUISITE: RabbitMQ Cluster Operator must be installed in the cluster
## Install with: kubectl apply -f https://github.com/rabbitmq/cluster-operator/releases/latest/download/cluster-operator.yml
##
## For RabbitmqCluster spec reference:
## https://www.rabbitmq.com/kubernetes/operator/using-operator.html
##
rabbitmq:
  # Change to `false` to disable in-cluster rabbitmq deployment.
  # Specify your external [messaging] connection parameters under st2.config
  enabled: true
  
  # Number of RabbitMQ nodes in the cluster (replicas)
  replicas: 3
  
  # Authentication configuration (REQUIRED when rabbitmq.enabled is true)
  # You must provide either:
  #   1. rabbitmq.auth.existingSecret (Kubernetes secret), OR
  #   2. rabbitmq.secretBackend.vault.enabled (Vault integration)
  # 
  # The secret must contain four keys: username, password, default_user.conf, erlangCookie
  # 
  # Example: Create the secret before installing this chart:
  #   kubectl create secret generic rabbitmq-credentials \
  #     --from-literal=username=st2-rabbitmq \
  #     --from-literal=password=YOUR_SECURE_PASSWORD \
  #     --from-literal=default_user.conf="default_user = st2-rabbitmq
  # default_pass = YOUR_SECURE_PASSWORD" \
  #     --from-literal=erlangCookie=$(openssl rand -base64 32)
  #
  # Or using a YAML file:
  #   apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: rabbitmq-credentials
  #   type: Opaque
  #   stringData:
  #     username: st2-rabbitmq
  #     password: YOUR_SECURE_PASSWORD
  #     default_user.conf: |
  #       default_user = st2-rabbitmq
  #       default_pass = YOUR_SECURE_PASSWORD
  #     erlangCookie: YOUR_ERLANG_COOKIE_HERE
  #
  # The erlangCookie should be an alphanumeric string, typically 20-40 characters.
  # Generate a secure erlangCookie with: openssl rand -base64 32
  #
  # IMPORTANT: The RabbitMQ operator requires the default_user.conf key for authentication.
  # StackStorm uses the username and password keys to connect to RabbitMQ.
  #
  # ============================================================================
  # CRITICAL TIMING REQUIREMENT: CREATE SECRET BEFORE DEPLOYING RABBITMQ
  # ============================================================================
  #
  # The RabbitMQ Cluster Operator only processes the default_user.conf file during
  # the INITIAL database creation when the cluster is first deployed. If you create
  # the credentials secret AFTER RabbitMQ has already been deployed, the operator
  # will NOT create your specified user, and authentication will fail.
  #
  # WHY THIS HAPPENS:
  # -----------------
  # 1. The operator mounts the secret to /etc/rabbitmq/conf.d/11-default_user.conf
  # 2. RabbitMQ only reads this file during initial database initialization
  # 3. Once the database exists, RabbitMQ ignores changes to default_user.conf
  # 4. If no secret exists at deployment time, RabbitMQ creates a random user
  #    (e.g., "default_user_SMlHtAb1pNld-CNSmuQ") with a random password
  # 5. Creating the secret later does NOT update or create users in the existing database
  #
  # SYMPTOMS OF LATE SECRET CREATION:
  # ----------------------------------
  # - StackStorm pods fail to connect to RabbitMQ with authentication errors
  # - RabbitMQ logs show: "PLAIN login refused: user 'st2-rabbitmq' - invalid credentials"
  # - The user specified in your secret does not exist in RabbitMQ
  # - A random "default_user_*" user exists instead
  #
  # HOW TO FIX IF SECRET WAS CREATED LATE:
  # ---------------------------------------
  #
  # Option 1: Manual User Creation (Recommended for existing deployments)
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # If you already have data in RabbitMQ and want to preserve it, manually create
  # the user with the credentials from your secret:
  #
  # 1. Get the credentials from your secret:
  #    USERNAME=$(kubectl get secret rabbitmq-credentials -o jsonpath='{.data.username}' | base64 -d)
  #    PASSWORD=$(kubectl get secret rabbitmq-credentials -o jsonpath='{.data.password}' | base64 -d)
  #
  # 2. Exec into a RabbitMQ pod:
  #    kubectl exec -it <rabbitmq-pod-name> -- bash
  #
  # 3. Create the user and set permissions:
  #    rabbitmqctl add_user "$USERNAME" "$PASSWORD"
  #    rabbitmqctl set_user_tags "$USERNAME" administrator
  #    rabbitmqctl set_permissions -p / "$USERNAME" ".*" ".*" ".*"
  #
  # 4. Verify the user was created:
  #    rabbitmqctl list_users
  #
  # 5. Restart StackStorm pods to reconnect with the new credentials:
  #    kubectl rollout restart deployment -l app.kubernetes.io/component=stackstorm
  #
  # Option 2: Fresh Deployment (For new installations or when data can be lost)
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # If you don't need to preserve existing RabbitMQ data, perform a clean deployment:
  #
  # 1. Delete the RabbitMQ cluster:
  #    kubectl delete rabbitmqcluster <cluster-name>
  #
  # 2. Delete the PersistentVolumeClaims to remove old data:
  #    kubectl delete pvc -l app.kubernetes.io/name=<cluster-name>
  #
  # 3. Ensure your credentials secret exists:
  #    kubectl get secret rabbitmq-credentials
  #
  # 4. Redeploy the Helm chart:
  #    helm upgrade --install <release-name> <chart> -f values.yaml
  #
  # PREVENTION:
  # -----------
  # Always create the RabbitMQ credentials secret BEFORE deploying this Helm chart
  # or before enabling rabbitmq.enabled=true. This ensures the operator can properly
  # initialize the database with your specified credentials during first startup.
  #
  # ============================================================================
  auth:
    existingSecret: ""  # e.g., "rabbitmq-credentials" (REQUIRED unless using Vault)
  # Persistence configuration
  persistence:
    enabled: true
    # Storage size per RabbitMQ pod
    storage: "10Gi"
    # Optional: specify storageClassName
    # storageClassName: ""
    # Alternative to persistent storage: use emptyDir (ephemeral storage)
    # When emptyDir is defined, it takes precedence over persistent storage
    emptyDir: {}
      # medium: ""  # "" (default) or "Memory" for tmpfs
      # sizeLimit: ""  # e.g., "1Gi"
  
  # Optional: Override RabbitMQ docker image
  # image: rabbitmq:3.13-management
  
  # Optional: Image pull secrets for private registries
  imagePullSecrets: []
    # - name: my-registry-secret
  
  # Resource requests and limits for RabbitMQ pods
  # We recommend setting memory limits in production deployments
  resources: {}
    # limits:
    #   cpu: 2000m
    #   memory: 2Gi
    # requests:
    #   cpu: 1000m
    #   memory: 2Gi
  
  # Service configuration
  service:
    port: 5672
    type: ClusterIP
    annotations: {}
    # IP family policy for dual-stack support
    # Options: "SingleStack", "PreferDualStack", "RequireDualStack"
    ipFamilyPolicy: ""
    # Additional labels for the service
    labels: {}
  
  # RabbitMQ configuration files
  # Additional RabbitMQ configuration (rabbitmq.conf format)
  # See: https://www.rabbitmq.com/configure.html
  additionalConfig: |
    # Enable queue mirroring for HA
    # cluster_partition_handling = autoheal
  
  # Advanced RabbitMQ configuration (advanced.config format)
  # See: https://www.rabbitmq.com/configure.html#advanced-config-file
  advancedConfig: ""
  
  # Environment variable configuration (rabbitmq-env.conf format)
  # See: https://www.rabbitmq.com/configure.html#customise-environment
  envConfig: ""
  
  # Erlang inet configuration (erl_inetrc format)
  # See: https://www.erlang.org/doc/apps/erts/inet_cfg.html
  erlangInetConfig: ""
  
  # Additional RabbitMQ plugins to enable
  # Default plugins (rabbitmq_management, rabbitmq_prometheus, rabbitmq_peer_discovery_k8s) are always enabled
  additionalPlugins: []
    # - rabbitmq_shovel
    # - rabbitmq_federation
  
  # TLS configuration
  tls:
    enabled: false
    # Name of secret containing tls.crt and tls.key
    secretName: ""
    # Name of secret containing ca.crt (optional)
    caSecretName: ""
    # Disable non-TLS listeners when TLS is enabled
    disableNonTLSListeners: false
  
  # Secret backend configuration
  # By default, uses externalSecret (Kubernetes secret)
  # Alternatively, can use Vault for credential management
  secretBackend:
    # Vault configuration (alternative to externalSecret)
    vault:
      enabled: false
      # Vault role for RabbitMQ
      role: ""
      # Annotations for Vault agent
      annotations: {}
      # Path to default user credentials in Vault
      defaultUserPath: ""
      # Image for default user updater sidecar
      defaultUserUpdaterImage: ""
      # TLS configuration for Vault
      tls: {}
  
  # Override configurations for advanced customization
  # These allow fine-grained control over the generated resources
  override: {}
    # Override service configuration
    #service: {}
      # spec:
      #   type: LoadBalancer
      #   ports:
      #     - name: additional-port
      #       port: 15672
    # Override statefulSet configuration
    #statefulSet:
    #  spec:
    #    template:
    #      spec:
    #        # nodeSelector should be defined here for proper CRD structure
    #        nodeSelector: {}
  
  # Lifecycle settings
  # Grace period for pod termination (default: 604800 = 7 days)
  terminationGracePeriodSeconds: 604800
  # Delay before starting RabbitMQ (default: 30 seconds)
  delayStartSeconds: 30
  
  # Automatically enable all feature flags on startup
  autoEnableAllFeatureFlags: false
  
  # Skip post-deployment steps performed by the operator
  skipPostDeploySteps: false
  
  # Pod placement controls
  # NOTE: nodeSelector is deprecated at this level. Use override.statefulSet.spec.template.spec.nodeSelector instead
  affinity: {}
  nodeSelector: {}
  tolerations: []

##
## Valkey Configuration (using Valkey Helm Chart)
##
## For Valkey chart reference:
## https://github.com/valkey-io/valkey-helm
##
valkey:
  # Change to `false` to disable in-cluster valkey deployment.
  # Specify your external [coordination] connection parameters under st2.config
  enabled: true
  
  # Valkey image configuration
  image:
    registry: "docker.io"
    repository: valkey/valkey
    tag: ""  # Uses chart's appVersion by default
    pullPolicy: IfNotPresent
  
  # Authentication configuration
  auth:
    enabled: true
    # IMPORTANT: Credentials should be stored in a Kubernetes secret, not in values.yaml
    # Create the secret before installing this chart:
    #
    # Example using kubectl:
    #   kubectl create secret generic valkey-credentials \
    #     --from-literal=default-password=YOUR_SECURE_PASSWORD
    #
    # Name of existing Kubernetes secret containing Valkey credentials
    usersExistingSecret: ""  # e.g., "valkey-credentials"
    
    # ACL users configuration
    # The 'default' user must be defined when auth is enabled
    aclUsers:
      default:
        permissions: "~* &* +@all"
        password: ""  # Set this or use usersExistingSecret
        # passwordKey: "default-password"  # Key in usersExistingSecret
  
  # Replica configuration for HA coordination backend
  replica:
    enabled: true
    # Number of replica instances (total pods = replicas + 1 master)
    replicas: 2
    # Username for replicas to authenticate to master
    replicationUser: "default"
    # Persistence configuration (required for replicas)
    persistence:
      size: "10Gi"
      storageClass: ""  # Uses cluster default if empty
      accessModes:
        - ReadWriteOnce
    # Read service configuration
    service:
      enabled: true
      type: ClusterIP
      port: 6379
  
  # Service configuration
  service:
    type: ClusterIP
    port: 6379
  
  # Resource requests and limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  # Pod placement controls
  affinity: {}
  nodeSelector: {}
  tolerations: []

